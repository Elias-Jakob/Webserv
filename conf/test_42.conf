server {
    listen = 127.0.0.1:8080;

    server_name = Youpi.com;
    
    client_max_body_size = 100;

    location / {
        accepted_methods = GET;
    }

	location \.bla {
        accepted_methods = POST;
        cgi_extension = .bla;
        cgi_path = cgi_tester;
    }

    location /post_body {
        accepted_methods = POST;
		client_max_body_size = 100;
    }

    location /directory {
        alias = /YoupiBanane;
        accepted_methods = GET;
        index = youpi.bad_extension;
    }
}