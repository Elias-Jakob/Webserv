# ── Vhost principal : localhost ───────────────────────────────
server
{
    listen = 127.0.0.1:8080;
    server_name = www.webserv.local;
    root = /www;
    client_max_body_size = 1048576;

    # Route racine — GET uniquement
    location /
    {
			index = index.html;
			accepted_methods = GET;
    }

    # Route contacts — GET POST DELETE
    location /contacts
    {
        index = contact.html;
        accepted_methods = GET, POST, DELETE;
        client_max_body_size = 1048576;
    }

    # Upload de fichiers — POST uniquement, stockage dans uploads/
    location /upload
    {
        accepted_methods = POST;
        client_max_body_size = 1048576;
        upload_store = /uploads;
        upload_enable = on;
    }

    # Suppression de fichiers uploadés — DELETE uniquement
    location /upload/delete
    {
        accepted_methods = DELETE;
        upload_store = /uploads;
        upload_enable = on;
    }

    # Directory listing activé
    location /files
    {
        accepted_methods = GET;
        autoindex = on;
    }

    # Redirection HTTP 301
    location /old
    {
        return = 301 /;
    }

    # Redirection HTTP 302
    location /temp
    {
        return = 302 /contacts;
    }

    # CGI Python
    location /cgi-bin
    {
        accepted_methods = GET, POST;
        alias = /cgi-bin;
        cgi_extension = .py;
    }

    error_page 400 = /home/ejakob/CommonCore2025/webserv/refactor/Webserv42_tester/www/errors/400.html;
    error_page 403 = /home/ejakob/CommonCore2025/webserv/refactor/Webserv42_tester/www/errors/403.html;
    error_page 404 = /home/ejakob/CommonCore2025/webserv/refactor/Webserv42_tester/www/errors/404.html;
    error_page 405 = /home/ejakob/CommonCore2025/webserv/refactor/Webserv42_tester/www/errors/405.html;
    error_page 413 = /home/ejakob/CommonCore2025/webserv/refactor/Webserv42_tester/www/errors/413.html;
    error_page 431 = /home/ejakob/CommonCore2025/webserv/refactor/Webserv42_tester/www/errors/431.html;
    error_page 500 = /home/ejakob/CommonCore2025/webserv/refactor/Webserv42_tester/www/errors/500.html;
    error_page 505 = /home/ejakob/CommonCore2025/webserv/refactor/Webserv42_tester/www/errors/505.html;
}

# ── Vhost secondaire : secondary ──────────────────────────────
server
{
    listen = 127.0.0.1:8081;
    server_name = secondary;
    root = /home/ejakob/CommonCore2025/webserv/refactor/Webserv42_tester/www;
    client_max_body_size = 0;

    location /upload
    {
        accepted_methods = POST;
        upload_enable = on;
        client_max_body_size = 1048576;
        upload_store = /uploads;
    }

    location /delete
    {
        accepted_methods = DELETE;
    }

    error_page 400 = /home/ejakob/CommonCore2025/webserv/refactor/Webserv42_tester/www/errors/error.html;
    error_page 413 = /home/ejakob/CommonCore2025/webserv/refactor/Webserv42_tester/www/errors/error.html;
    error_page 500 = /home/ejakob/CommonCore2025/webserv/refactor/Webserv42_tester/www/errors/error.html;
}
