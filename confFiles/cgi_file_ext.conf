server {
    listen = 127.0.0.1:8080;
    server_name = website.com;

    error_page 404 = /errors/404.html;
    error_page 500 = /errors/500.html;

    client_max_body_size = 2K;

    location / {
        root = /www;
        accepted_methods = GET, POST;
        index = index.html;
        autoindex = on;
    }

    location /www {
        root = /www;
        accepted_methods = GET, POST, HEAD;
        autoindex = on;
    }
    
    location /cba {
        root = /www;
        index = text.html;
        accepted_methods = GET;
        autoindex = off;
    }

	location \.py {
		cgi_extension = .py;
		cgi_path = /www/cgi-bin/sleepy.py
	}

    location /cgi-bin {
        accepted_methods = GET, POST;
        root = /cgi-bin;
        cgi_extension = .php, .py;
    }
}