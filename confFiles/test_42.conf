server {
    listen = 127.0.0.1:8080;
    listen = 127.0.0.1:8081;
    listen = 127.0.0.1:8082;
    server_name = meinewebsite.com;

    client_max_body_size = 2K;
    
    location / {
        accepted_methods = GET;
    }

    location /post_body {
        accepted_methods = POST;
    }

	location /directory {
		root = /YoupiBanane;
        accepted_methods = GET;
		index = youpi.bad_extension;
	}
}